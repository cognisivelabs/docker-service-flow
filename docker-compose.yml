services:
  server:
    build: .
    command: ["--mode", "server", "--port", "3005"]
    ports:
      - "3005:3005"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  sniffer:
    build: .
    command: ["--mode", "sniffer", "--server-url", "http://127.0.0.1:3005/api/events"]
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - INTERFACE=${INTERFACE:-}
    depends_on:
      - server
